###############################################################################
# Via Oceânica AI Platform — Docker Compose
#
# Architecture:
#   nginx (80/443) → gateway (8200) → platform-core (4000)
#                                    → ai-service (4010)
#                                    → billing (4020)
#                                    → mod-restauracao (4001)
#                                    → mod-gestao-email (4002)
#                                    → mod-contabilidade (4003)
#                                    → mod-email (4004)
#                                    → mod-helpdesk (4001)
#   shell (3001) — frontend SPA (served by nginx container)
#   contabilidade-frontend (7100) — ViaContab Next.js frontend (iframe)
#   email-frontend (3000) — Email Next.js frontend (iframe)
#   helpdesk-frontend (3000) — Helpdesk Next.js frontend (iframe)
#
# Dependencies:
#   - PostgreSQL (local container) — platform_db
#   - Redis (local container) — session cache, rate limiting
#   - Qdrant (vector DB) — semantic search for contabilidade module
#
# Secrets Management:
#   All sensitive values are injected via environment variables from .env file.
#   NEVER commit .env to version control. See deploy/env-reference.md for docs.
#   Required .env keys: JWT_SECRET, POSTGRES_PASSWORD, SMTP_PASS,
#   AI_PROVIDER_API_KEY, OPENAI_API_KEY, R2_* credentials.
#
# Usage:
#   docker compose up -d                  # Start all services
#   docker compose logs -f gateway        # Follow gateway logs
#   docker compose down                   # Stop all services
###############################################################################

x-common-env: &common-env
  NODE_ENV: production
  TZ: ${TZ:-Atlantic/Azores}
  JWT_SECRET: ${JWT_SECRET:-viao-change-me-in-production-2024}
  COOKIE_NAME: viao_session
  REDIS_URL: redis://redis:6379

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      TZ: ${TZ:-Atlantic/Azores}
      PGTZ: ${TZ:-Atlantic/Azores}
      POSTGRES_DB: viaoceanica_platform
      POSTGRES_USER: viaoceanica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viao_db_2024_secure}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-contabilidade-db.sh:/docker-entrypoint-initdb.d/00-init-contabilidade.sh:ro
      - ./deploy/init-email-db.sh:/docker-entrypoint-initdb.d/01-init-email.sh:ro
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viaoceanica -d viaoceanica_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Atlantic/Azores}
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Platform Core ──────────────────────────────────────────────────
  platform-core:
    build:
      context: ./services/platform-core
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      PLATFORM_CORE_PORT: "4000"
      SMTP_HOST: ${SMTP_HOST:-mail.viaoceanica.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-viaoceanicaai@viaoceanica.com}
      SMTP_PASS: "SYN_%FK!S)H{YVGV"
      SMTP_FROM: ${SMTP_FROM:-viaoceanicaai@viaoceanica.com}
      APP_BASE_URL: ${APP_BASE_URL:-http://ai.viaoceanica.com}
      DATABASE_URL: postgresql://viaoceanica:${POSTGRES_PASSWORD:-viao_db_2024_secure}@postgres:5432/viaoceanica_platform
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Gateway ─────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      GATEWAY_PORT: "8200"
      PLATFORM_CORE_URL: http://platform-core:4000
      AI_SERVICE_URL: http://ai-service:4010
      BILLING_SERVICE_URL: http://billing:4020
      SHELL_URL: http://shell:3001
      MOD_RESTAURACAO_URL: http://mod-restauracao:4001
      MOD_GESTAO_EMAIL_URL: http://mod-gestao-email:4002
      MOD_CONTABILIDADE_URL: http://mod-contabilidade:4003
      MOD_EMAIL_URL: http://mod-email:4004
      MOD_HELPDESK_URL: http://mod-helpdesk:4001
    depends_on:
      redis:
        condition: service_healthy
      platform-core:
        condition: service_healthy
      shell:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8200/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── LiteLLM Proxy ────────────────────────────────────────────────
  litellm-proxy:
    build:
      context: ./services/litellm-proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: "4025"
      LOCAL_AI_BASE_URL: "http://host.docker.internal:11434"
      LOCAL_AI_API_KEY: "ollama"
      DEFAULT_CHAT_MODEL: "qwen2.5:14b-instruct"
      DEFAULT_EMBEDDING_MODEL: "qwen3-embedding:8b"
      OPENROUTER_IMAGE_MODEL: "google/gemini-2.5-flash-image-preview"
      OPENROUTER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      OPENAI_IMAGE_MODEL: "dall-e-3"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4025/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── AI Service ────────────────────────────────────────────────────
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      AI_SERVICE_PORT: "4010"
      AI_PROVIDER_API_KEY: "litellm-proxy"
      AI_PROVIDER_BASE_URL: "http://litellm-proxy:4025/v1"
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: "viaoceanica"
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      DATABASE_URL: postgresql://viaoceanica:${POSTGRES_PASSWORD:-viao_db_2024_secure}@postgres:5432/viaoceanica_platform
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm-proxy:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.2"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4010/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Billing Service ──────────────────────────────────────────────
  billing:
    build:
      context: ./services/billing
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      BILLING_PORT: "4020"
      DATABASE_URL: postgresql://viaoceanica:${POSTGRES_PASSWORD:-viao_db_2024_secure}@postgres:5432/viaoceanica_platform
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4020/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Shell (Frontend SPA) ─────────────────────────────────────────
  shell:
    build:
      context: .
      dockerfile: shell/Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Atlantic/Azores}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 16M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Module: Restauração ──────────────────────────────────────────
  mod-restauracao:
    build:
      context: ./modules/restauracao
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      MOD_RESTAURACAO_PORT: "4001"
      DATABASE_URL: postgresql://viaoceanica:${POSTGRES_PASSWORD:-viao_db_2024_secure}@postgres:5432/viaoceanica_platform
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Module: Gestão Email ─────────────────────────────────────────
  mod-gestao-email:
    build:
      context: ./modules/gestao-email
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      MOD_GESTAO_EMAIL_PORT: "4002"
      DATABASE_URL: postgresql://viaoceanica:${POSTGRES_PASSWORD:-viao_db_2024_secure}@postgres:5432/viaoceanica_platform
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4002/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Qdrant (Vector DB) ────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Atlantic/Azores}
    volumes:
      - qdrant-data:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Module: Contabilidade (Backend API) ──────────────────────────
  mod-contabilidade:
    build:
      context: ./modules/contabilidade
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Atlantic/Azores}
      DATABASE_URL: postgresql+psycopg2://viaoceanica:${POSTGRES_PASSWORD:-viao_db_2024_secure}@postgres:5432/viaoceanica_contabilidade
      QDRANT_URL: http://qdrant:6333
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VISION_MODEL: qwen2.5vl:7b
      EMBEDDING_MODEL: qwen3-embedding:8b
      EMBEDDING_VECTOR_SIZE: "4096"
      NIF_PT_API_KEY: ${NIF_PT_API_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-viaoceanica}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      DEFAULT_TENANT_ID: "1"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.2"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4003/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Module: Contabilidade (Frontend) ─────────────────────────────
  contabilidade-frontend:
    build:
      context: ./modules/contabilidade/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Atlantic/Azores}
      SERVER_API_BASE_URL: http://mod-contabilidade:4003
    depends_on:
      - mod-contabilidade
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/module/contabilidade"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Module: Email (Backend API) ───────────────────────────────────
  mod-email:
    build:
      context: ./modules/email
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      MOD_EMAIL_PORT: "4004"
      DATABASE_URL: postgresql://viaoceanica:${POSTGRES_PASSWORD:-viao_db_2024_secure}@postgres:5432/viaoceanica_email
      AI_SERVICE_URL: http://ai-service:4010
      AI_AGENT_ID: email
      EMAIL_CREDENTIALS_SECRET: ${EMAIL_CREDENTIALS_SECRET:-change-me-email-credentials-secret}
      EMAIL_SYNC_INTERVAL_SECONDS: ${EMAIL_SYNC_INTERVAL_SECONDS:-300}
      ALLOW_DEMO_TENANT: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4004/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Module: Email (Background Sync Worker) ────────────────────────
  email-sync-worker:
    build:
      context: ./modules/email
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      <<: *common-env
      MOD_EMAIL_PORT: "4004"
      DATABASE_URL: postgresql://viaoceanica:${POSTGRES_PASSWORD:-viao_db_2024_secure}@postgres:5432/viaoceanica_email
      AI_SERVICE_URL: http://ai-service:4010
      AI_AGENT_ID: email
      EMAIL_CREDENTIALS_SECRET: ${EMAIL_CREDENTIALS_SECRET:-change-me-email-credentials-secret}
      EMAIL_SYNC_INTERVAL_SECONDS: ${EMAIL_SYNC_INTERVAL_SECONDS:-300}
      EMAIL_IMAP_SYNC_BATCH_SIZE: ${EMAIL_IMAP_SYNC_BATCH_SIZE:-100}
      ALLOW_DEMO_TENANT: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mod-email:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 1024M
        reservations:
          cpus: "0.05"
          memory: 128M

  # ─── Module: Email (Frontend) ──────────────────────────────────────
  email-frontend:
    build:
      context: ./modules/email/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Atlantic/Azores}
      SERVER_API_BASE_URL: http://mod-email:4004
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      - mod-email
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http'); const req=http.get('http://127.0.0.1:3000/module/email', res=>process.exit(res.statusCode===200?0:1)); req.on('error', ()=>process.exit(1)); req.setTimeout(4000, ()=>{req.destroy(); process.exit(1);});"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─── Module: Helpdesk (Backend API) ───────────────────────────────
  mod-helpdesk:
    build:
      context: ./modules/helpdesk
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      MOD_HELPDESK_PORT: "4001"
      DATABASE_URL: postgresql://viaoceanica:${POSTGRES_PASSWORD:-viao_db_2024_secure}@postgres:5432/viaoceanica_helpdesk
      AI_SERVICE_URL: http://ai-service:4010
      AI_AGENT_ID: helpdesk
      DEFAULT_TENANT_ID: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Module: Helpdesk (Frontend) ──────────────────────────────────
  helpdesk-frontend:
    build:
      context: ./modules/helpdesk/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Atlantic/Azores}
      SERVER_API_BASE_URL: http://mod-helpdesk:4001
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      - mod-helpdesk
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http'); const req=http.get('http://127.0.0.1:3000/module/helpdesk', res=>process.exit(res.statusCode===200?0:1)); req.on('error', ()=>process.exit(1)); req.setTimeout(4000, ()=>{req.destroy(); process.exit(1);});"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─── Nginx Proxy Manager (Public Reverse Proxy) ───────────────────
  npm:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Atlantic/Azores}
      DISABLE_IPV6: "true"
      DB_SQLITE_FILE: /data/database.sqlite
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  npm-data:
  npm-letsencrypt:
