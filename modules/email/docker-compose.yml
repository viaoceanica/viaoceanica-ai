# ─── Email — Docker Compose ────────────────────────────────────
# Full docker-compose.yml for standalone development and deployment.

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-development}
  REDIS_URL: redis://redis:6379
  TZ: Europe/Lisbon

services:
  mod-email:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${MOD_EMAIL_PORT:-4004}:4004"
    environment:
      <<: *common-env
      MOD_EMAIL_PORT: "4004"
      DATABASE_URL: postgresql://viaoceanica:${POSTGRES_PASSWORD:-viao_db_2024_secure}@postgres:5432/viaoceanica_email
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:4010}
      AI_AGENT_ID: ${AI_AGENT_ID:-email}
      EMAIL_CREDENTIALS_SECRET: ${EMAIL_CREDENTIALS_SECRET:-change-me-email-credentials-secret}
      EMAIL_SYNC_INTERVAL_SECONDS: ${EMAIL_SYNC_INTERVAL_SECONDS:-300}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-}
      ALLOW_DEMO_TENANT: ${ALLOW_DEMO_TENANT:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4004/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - mod-email-data:/app/data

  email-sync-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      <<: *common-env
      MOD_EMAIL_PORT: "4004"
      DATABASE_URL: postgresql://viaoceanica:${POSTGRES_PASSWORD:-viao_db_2024_secure}@postgres:5432/viaoceanica_email
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:4010}
      AI_AGENT_ID: ${AI_AGENT_ID:-email}
      EMAIL_CREDENTIALS_SECRET: ${EMAIL_CREDENTIALS_SECRET:-change-me-email-credentials-secret}
      EMAIL_SYNC_INTERVAL_SECONDS: ${EMAIL_SYNC_INTERVAL_SECONDS:-300}
      EMAIL_IMAP_SYNC_BATCH_SIZE: ${EMAIL_IMAP_SYNC_BATCH_SIZE:-100}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-}
      ALLOW_DEMO_TENANT: ${ALLOW_DEMO_TENANT:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mod-email:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 1024M
        reservations:
          cpus: "0.05"
          memory: 128M

  email-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      SERVER_API_BASE_URL: http://mod-email:4004
    depends_on:
      mod-email:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: viaoceanica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viao_db_2024_secure}
      POSTGRES_DB: viaoceanica_email
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viaoceanica -d viaoceanica_email"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mod-email-data:
  postgres-data:
  redis-data:
